plugins {
    id "java-library"
    id "maven-publish"
}

allprojects {
    apply plugin: "java-library"
    apply plugin: "maven-publish"

    group = rootProject.maven_group

    repositories {
        maven {
            name = "CurseMaven"
            url = "https://www.cursemaven.com"
            metadataSources {
                artifact()
            }
            content {
                includeGroupByRegex "curse\\.maven"
            }
        }
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.neoforged.net/releases" }
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    name = "GeckoLib"
                    url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
                }
            }
            filter {
                includeGroup("software.bernie.geckolib")
            }
        }
        maven { url "https://api.modrinth.com/maven/" }
    }

    tasks.withType(JavaCompile) {
        options.encoding = "UTF-8"
    }

    java {
        withSourcesJar()
    }
}

tasks.named('jar') {
    enabled = false
}

def registerStandaloneTasks = { String moduleDirName, String taskPrefix ->
    def standaloneDir = file(moduleDirName)
    def wrapperName = providers.systemProperty('os.name').get().toLowerCase().contains('win')
            ? 'gradlew.bat'
            : 'gradlew'
    def wrapper = new File(standaloneDir, wrapperName)

    ['build', 'assemble', 'clean', 'runClient', 'runServer'].each { taskName ->
        tasks.register("${taskPrefix}${taskName.capitalize()}", Exec) {
            group = moduleDirName
            description = "Runs '${taskName}' inside ${moduleDirName}"
            workingDir = standaloneDir
            environment 'GRADLE_USER_HOME', gradle.gradleUserHomeDir.absolutePath
            commandLine wrapper.absolutePath, taskName
        }
    }
}

registerStandaloneTasks('forge-1.20.1', 'forge1201')
registerStandaloneTasks('fabric-1.20.1', 'fabric1201')
