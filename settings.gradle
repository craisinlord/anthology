pluginManagement {
    repositories {
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.neoforged.net/releases" }
        maven { url "https://maven.parchmentmc.org" }
        maven { url "https://repo.spongepowered.org/repository/maven-public/" }
        gradlePluginPortal()
    }
    plugins {
        id 'net.fabricmc.fabric-loom-remap' version '1.16.3'
        id 'net.fabricmc.fabric-loom' version '1.16.3'
        id 'net.neoforged.moddev' version '2.0.148'
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

include("common-1.20.1")
include("common-1.21.1")
include("fabric-1.21.1")
include("neoforge-1.21.1")
include("common-26.1")
include("fabric-26.1")
include("neoforge-26.1")
include("common-26.2")
include("fabric-26.2")
include("neoforge-26.2")
include("common-26.3")
include("fabric-26.3")
include("neoforge-26.3")

rootProject.name = "Anthology"
