plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.15.5'
    id 'maven-publish'
}

def anthologyProperties = new Properties()
file('../gradle.properties').withInputStream { anthologyProperties.load(it) }
anthologyProperties.each { key, value ->
    if (!project.hasProperty(key)) {
        project.ext.set(key, value)
    }
}

group = maven_group
version = "${mod_version}+1.20.1-fabric"

base {
    archivesName = mod_id
}

repositories {
    maven { url "https://maven.fabricmc.net/" }
    mavenCentral()
    maven { url "https://repo.spongepowered.org/repository/maven-public/" }
    exclusiveContent {
        forRepository {
            maven {
                name = "GeckoLib"
                url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
            }
        }
        filter {
            includeGroup("software.bernie.geckolib")
            includeGroup("com.eliotlash.mclib")
        }
    }
}

tasks.withType(AbstractCopyTask).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
    withSourcesJar()
}

sourceSets {
    main {
        java {
            srcDirs += file('../common-1.20.1/src/main/java')
        }
        resources {
            srcDirs += file('../common-1.20.1/src/main/resources')
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version_1_20_1}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version_1_20_1}"
    modApi "net.fabricmc.fabric-api:fabric-api:${fabric_api_version_1_20_1}"
    modCompileOnly "software.bernie.geckolib:geckolib-fabric-${minecraft_version_1_20_1}:${geckolib_version_1_20_1}"
    modCompileOnly files('../compile_jars/sodium-fabric-0.5.13+mc1.20.1.jar')

    annotationProcessor "org.spongepowered:mixin:0.8.7:processor"
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${mixin_extras}"))
}

loom {
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName = "${mod_id}.mixins.refmap.json"
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        version              : project.version,
        minecraft_version    : minecraft_version_1_20_1,
        fabric_loader_version: fabric_loader_version_1_20_1,
        mod_id               : mod_id,
        mod_name             : mod_name,
        mod_description      : mod_description,
        mod_author           : mod_author,
        license              : license,
        homepage_url         : homepage_url,
        issues_url           : issues_url,
        sources_url          : sources_url
    ]
    inputs.properties replaceProperties

    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }

    doLast {
        ["${mod_id}-common.mixins.json", "${mod_id}-fabric.mixins.json", "${mod_id}-sodium.mixins.json"].each { configName ->
            var mixinConfig = new File(destinationDir, configName)
            var json = new groovy.json.JsonSlurper().parse(mixinConfig)
            json.put('refmap', "${mod_id}.mixins.refmap.json")
            mixinConfig.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json))
        }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = project.group
            artifactId = "${mod_id}-fabric-1.20.1"
            version = project.version

            artifact(project.tasks.named('remapJar'))
            artifact(project.tasks.named('remapSourcesJar')) {
                classifier = 'sources'
            }

            pom {
                name = "${mod_name} (Fabric 1.20.1)"
                description = mod_description
            }
        }
    }
}


dependencies {
    modRuntimeOnly files('../compile_jars/sodium-fabric-0.5.13+mc1.20.1.jar')
}
